# Basic package metadata
[package]
name = "cbc-runtime"                         # The name of the crate
description = "cbc-runtime part of CAERULEAN  BYTECHAINS."  # Description for documentation
version = "0.1.0"                            # Version of the crate
license = "Unlicense"                        # License type for the project
authors.workspace = true                     # Inherit authors from the workspace settings
homepage.workspace = true                    # Inherit homepage URL from workspace
repository.workspace = true                  # Inherit repository URL from workspace
edition.workspace = true                     # Use the Rust edition specified in the workspace
publish = false                              # Prevent publishing to crates.io

# Configuration for generating documentation on docs.rs
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]       # Specify target for documentation builds

# List of project dependencies
[dependencies]
codec = { features = ["derive"], workspace = true }                              # SCALE codec with derive support
frame-benchmarking = { optional = true, workspace = true }                       # Optional benchmarking support
frame-executive.workspace = true                                                 # FRAME core executor
frame-metadata-hash-extension.workspace = true                                   # Metadata hash checker
frame-support = { features = ["experimental"], workspace = true }                # Support library for pallets
frame-system-benchmarking = { optional = true, workspace = true }                # Optional system benchmarking
frame-system-rpc-runtime-api.workspace = true                                    # System runtime APIs for RPC
frame-system.workspace = true                                                    # Core system pallet
frame-try-runtime = { optional = true, workspace = true }                        # Optional try-runtime feature
pallet-aura.workspace = true                                                     # Aura consensus pallet
pallet-balances.workspace = true                                                 # Balances pallet
pallet-grandpa.workspace = true                                                  # Grandpa consensus pallet
pallet-sudo.workspace = true                                                     # Sudo pallet for superuser access
pallet-template.workspace = true                                                 # Custom template pallet
pallet-timestamp.workspace = true                                                # Timestamp pallet
pallet-transaction-payment-rpc-runtime-api.workspace = true                      # Payment APIs for transactions
pallet-transaction-payment.workspace = true                                      # Transaction fee pallet
scale-info = { features = ["derive", "serde"], workspace = true }                # Type metadata generation with serde
serde_json = { workspace = true, default-features = false, features = ["alloc"] }# JSON support with alloc only

# Substrate primitives and runtime libraries
sp-api.workspace = true                                                          # Substrate runtime API interface
sp-block-builder.workspace = true                                                # Block building traits
sp-consensus-aura = { features = ["serde"], workspace = true }                   # Aura consensus engine
sp-consensus-grandpa = { features = ["serde"], workspace = true }                # Grandpa consensus engine
sp-core = { features = ["serde"], workspace = true }                             # Core Substrate types
sp-genesis-builder.workspace = true                                              # Genesis block builder
sp-inherents.workspace = true                                                    # Support for inherents (e.g., timestamp)
sp-keyring.workspace = true                                                      # Development keyring support
sp-offchain.workspace = true                                                     # Offchain workers
sp-runtime = { features = ["serde"], workspace = true }                          # Core runtime traits
sp-session.workspace = true                                                      # Session management
sp-storage.workspace = true                                                      # Runtime storage primitives
sp-transaction-pool.workspace = true                                             # Transaction pool management
sp-version = { features = ["serde"], workspace = true }                          # Runtime versioning support

# Build dependencies used at compile time
[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true } # WASM build tool

# Feature definitions
[features]
default = ["std"]                            # Enable standard library support by default

# Enable `std` support for all dependencies that support both `std` and `no_std`
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"frame-try-runtime?/std",
	"pallet-aura/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-sudo/std",
	"pallet-template/std",
	"pallet-timestamp/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"scale-info/std",
	"serde_json/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-consensus-aura/std",
	"sp-consensus-grandpa/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-keyring/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-storage/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"substrate-wasm-builder",
]

# Benchmarking feature for runtime pallets
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pallet-template/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]

# Try-runtime feature for runtime upgrade testing and dry runs
try-runtime = [
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"frame-try-runtime/try-runtime",
	"pallet-aura/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-sudo/try-runtime",
	"pallet-template/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"sp-runtime/try-runtime",
]

# Feature to enable metadata hashing for compatibility checks
# Increases compile time due to double compilation (for metadata and final binary)
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# Convenience feature for preparing a runtime for on-chain release
on-chain-release-build = ["metadata-hash", "sp-api/disable-logging"]
