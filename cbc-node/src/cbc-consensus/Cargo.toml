[package]
name = "cbc-consensus"
version = "0.1.0"
edition = "2021"
authors = ["CBC Team"]
description = "Consensus mechanism for CBC blockchain"

[dependencies]
codec = { features = ["derive", "std"], workspace = true }
frame-benchmarking = { optional = true, features = ["std"], workspace = true }
frame-support = { features = ["std"], workspace = true }
frame-system = { features = ["std"], workspace = true }
scale-info = { features = ["derive", "std"], workspace = true }
sp-std = { features = ["std"], workspace = true }
sp-core = { features = ["std"], workspace = true }
sp-runtime = { features = ["std"], workspace = true }
sp-api = { features = ["std"], workspace = true }
sp-blockchain = { workspace = true }
sp-consensus = { workspace = true }
sp-inherents = { features = ["std"], workspace = true }
sp-timestamp = { features = ["std"], workspace = true }
sp-block-builder = { features = ["std"], workspace = true }
sp-keyring = { features = ["std"], workspace = true }
sp-application-crypto = { features = ["std"], workspace = true }
sp-io = { features = ["std"], workspace = true }
sp-keystore = { version = "0.42.0", default-features = false }
sc-consensus = { workspace = true, default-features = true }
sc-transaction-pool-api = { workspace = true }
sc-basic-authorship = { workspace = true }
sc-client-api = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
cbc-runtime = { features = ["std"], workspace = true }
tokio = { version = "1.37", features = ["rt", "macros", "time"] }
log = "0.4"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
pallet-cbc-dcf = { workspace = true }
pallet-cbc-dvf = { workspace = true }
pallet-cbc-pos = { workspace = true }
pallet-cbc-poi = { workspace = true }
pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }
prometheus = { version = "0.13", default-features = false }
parking_lot = "0.12"
once_cell = "1.19"
toml = "0.8"
serde_json = { workspace = true }
sc-network = { workspace = true }
sc-network-types = { workspace = true }
sc-network-gossip = { workspace = true }


[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }
pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-std/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-api/std",
	"sp-block-builder/std",
	"sp-keystore/std",
	"pallet-cbc-dcf/std",
	"pallet-cbc-dvf/std",
	"pallet-cbc-pos/std",
	"pallet-cbc-poi/std",
	"pallet-balances/std",
	"pallet-timestamp/std"
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]