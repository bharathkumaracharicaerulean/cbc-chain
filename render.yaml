###############################################################################
# CBC Chain — 3-validator network on Render
#
# Alice's network key is baked into the Docker image (keys/alice/secret_ed25519)
# so her peer-id is fixed and known at build time.  Bob and Charlie derive it
# automatically at startup — no manual peer-id copy-paste required.
#
# Frontend access:
#   Render terminates TLS and proxies to port 9944 on Alice.
#   Your frontend connects via:
#     wss://cbc-alice.onrender.com   (WebSocket RPC)
#     https://cbc-alice.onrender.com (HTTP RPC)
#
#   Bob and Charlie stay private (pserv) — only Alice is the public RPC node.
###############################################################################

services:

  # ── Alice (bootnode + validator + public RPC) ──────────────────────────────
  # type: web  → Render assigns a public URL and routes HTTPS/WSS to port 9944
  - type: web
    name: cbc-alice
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ROLE
        value: alice
      - key: PORT
        value: "9944"
      - key: RUST_LOG
        value: info,cbc_consensus=debug
    disk:
      name: alice-chain-data
      mountPath: /data
      sizeGB: 20

  # ── Bob (validator, private) ───────────────────────────────────────────────
  - type: pserv
    name: cbc-bob
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: NODE_ROLE
        value: bob
      - key: RUST_LOG
        value: info,cbc_consensus=debug
      - key: ALICE_HOST
        value: cbc-alice
    disk:
      name: bob-chain-data
      mountPath: /data
      sizeGB: 10

  # ── Charlie (validator, private) ──────────────────────────────────────────
  - type: pserv
    name: cbc-charlie
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: NODE_ROLE
        value: charlie
      - key: RUST_LOG
        value: info,cbc_consensus=debug
      - key: ALICE_HOST
        value: cbc-alice
    disk:
      name: charlie-chain-data
      mountPath: /data
      sizeGB: 10
