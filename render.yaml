services:
  # ─── Alice (bootnode + validator) ───────────────────────────────────────────
  - type: web
    name: cbc-alice
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /
    cacheDirectories:
      - /cargo
      - /target
    envVars:
      - key: NODE_ROLE
        value: alice
      - key: P2P_PORT
        value: "30333"
      - key: RPC_PORT
        value: "9944"
      - key: PROMETHEUS_PORT
        value: "9615"
      - key: RUST_LOG
        value: info,cbc_consensus=debug
      - key: CARGO_HOME
        value: /cargo
      - key: CARGO_BUILD_TARGET_DIR
        value: /target
    disk:
      name: alice-chain-data
      mountPath: /data
      sizeGB: 20
