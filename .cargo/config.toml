[build]
jobs = 1

# Fix: librocksdb-sys v0.11.0+8.1.1 (RocksDB 8.1.1) uses uint64_t/uint32_t in
# headers without including <cstdint>. With gcc-15 / clang-18 these types are
# no longer available via transitive includes. Force-including <cstdint> fixes it.
[env]
CXXFLAGS = "-include cstdint"

[profile.dev]
debug = 1
incremental = true